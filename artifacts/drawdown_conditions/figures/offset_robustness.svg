  <g id="text_33">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25364a" x="78.912" y="34.56" transform="rotate(-0 78.912 34.56)">Five views of the same 5-minute history</text>
  </g>
  <g id="text_34">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25364a" x="78.912" y="58.176" transform="rotate(-0 78.912 58.176)">Full-period bar maximum drawdown · 2021-2025 · 0 bps · lower is better</text>
  </g>
  <g id="text_35">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25364a" x="78.912" y="80.064" transform="rotate(-0 78.912 80.064)">The slow rule beats its exposure-matched control in +0, but loses that advantage in +4.</text>
  </g>
  <g id="text_36">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25364a" x="78.912" y="493.632" transform="rotate(-0 78.912 493.632)">+0: slow rule minus matched constant = -1.38 percentage points  |  +4: slow rule minus matched constant = +0.10 percentage points</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25364a" x="78.912" y="520.128" transform="rotate(-0 78.912 520.128)">Matched constants come directly from each view's sealed 2025 cumulative comparison, using its full-period mean exposure.</text>
  </g>
  <g id="text_38">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #607086" x="78.912" y="539.712" transform="rotate(-0 78.912 539.712)">Offsets are sensitivity views, not independent markets. Matched constants are retrospective comparators, not causal policies.</text>
  </g>
