name: cross-index-degree-transfer-utility-v1-frozen-validation

on:
  workflow_dispatch:
  push:
    branches: [research/cross-index-degree-transfer-utility-v1-20260912]
    paths:
      - '.github/workflows/cross-index-degree-transfer-utility-v1-frozen-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  reusable-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/cross_index_degree_transfer_utility_v1/
            /research/activity_degree_incremental_utility_v1/run_study.py
            /scripts/run_cross_index_degree_transfer_validation_v1.py
            /docs/governance/DATA_USAGE_POLICY_V2.md
            /docs/governance/data_usage_declaration.json
            /docs/governance/blackbox_query_ledger.json
            /scripts/validate_data_usage_policy.py
            /data/market/5m/000688.SH/2020.parquet
            /data/market/5m/000688.SH/2021.parquet
            /data/market/5m/000688.SH/2022.parquet
            /data/market/5m/000688.SH/2023.parquet
            /data/market/5m/000688.SH/2024.parquet
            /data/market/5m/000688.SH/2025.parquet
            /data/market/5m/000852.SH/2020.parquet
            /data/market/5m/000852.SH/2021.parquet
            /data/market/5m/000852.SH/2022.parquet
            /data/market/5m/000852.SH/2023.parquet
            /data/market/5m/000852.SH/2024.parquet
            /data/market/5m/000852.SH/2025.parquet
            /data/cross_index_risk_gate_3s_v1/manifest.json
            /data/cross_index_risk_gate_3s_v1/000688.SH_2021.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2022.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2023.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2024.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2025.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2021.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2022.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2023.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2024.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2025.parquet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest
      - name: Download original pre-Validation frozen model artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-index-degree-v1-frozen-models-34676891139
          path: frozen
          github-token: ${{ github.token }}
          run-id: 34676891139
      - name: Verify exact original freeze and governance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_data_usage_policy.py --repo-root .
          test "$(git hash-object research/cross_index_degree_transfer_utility_v1/PROTOCOL.md)" = "9d925368f01163b51421d5221d9a3ba4f5adaaaf"
          test "$(git hash-object research/activity_degree_incremental_utility_v1/run_study.py)" = "b148d8ccf1d13651434b7b14b42a27dc4b31f5e6"
          test "$(cat frozen/MODEL_SHA256.txt)" = "7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6"
          test "$(sha256sum frozen/FROZEN_MODELS.json | awk '{print $1}')" = "7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6"
          ! find data -type f -name '*2026*' | grep .
          test ! -e data/cross_index_risk_gate_2026_v1
      - name: Re-run causal invariants
        run: python -m pytest -q research/cross_index_degree_transfer_utility_v1/test_study.py
      - name: Score exact original frozen probes on reusable 2024-2025 Validation
        run: |
          mkdir -p artifacts
          python scripts/run_cross_index_degree_transfer_validation_v1.py \
            --repo-root . --phase validate --out artifacts/validation \
            --models frozen/FROZEN_MODELS.json --model-sha frozen/MODEL_SHA256.txt
          cp frozen/FROZEN_MODELS.json frozen/MODEL_SHA256.txt frozen/FIT_RECEIPT.json artifacts/validation/
      - name: Guard role and hash evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('artifacts/validation/VALIDATION_RESULTS.json'))
          assert s['model_sha256']=='7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6'
          assert s['validation_years']==[2024,2025]
          assert s['validation_reused'] is True and s['fresh_oos'] is False
          assert s['read_2026'] is False and s['blackbox_queried'] is False
          assert s['pnl_computed'] is False and s['candidate_nominated'] is False
          assert s['production_authority'] is False and s['v20_started'] is False and s['d6_started'] is False
          print(json.dumps({'decision':s['decision'],'joint_endpoint_support':s['joint_endpoint_support']},indent=2))
          PY
          cd artifacts/validation
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat VALIDATION_RESULTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: cross-index-degree-v1-frozen-validation-${{ github.run_id }}
          path: artifacts/validation
          retention-days: 90
          if-no-files-found: error
