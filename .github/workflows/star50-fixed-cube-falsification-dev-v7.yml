name: star50-fixed-cube-falsification-dev-v7
on:
  push:
    branches:
      - research/star50-fixed-cube-falsification-dev-v7-20260908
jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/star50_fixed_cube_falsification_dev_v7
            docs/research/star50_highvol_mechanism_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/cross_index_risk_gate_v1/1m/000688.SH/2020.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2021.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2022.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2023.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard Development-only data
        run: |
          python - <<'PY'
          from pathlib import Path
          f=sorted(p.name for p in Path('data/cross_index_risk_gate_v1/1m/000688.SH').glob('*.parquet'))
          assert f==['2020.parquet','2021.parquet','2022.parquet','2023.parquet'],f
          assert not Path('data/cross_index_risk_gate_2026_v1').exists()
          PY
      - run: python -m pytest -q docs/research/star50_fixed_cube_falsification_dev_v7/test_cube_dev.py
      - run: python docs/research/star50_fixed_cube_falsification_dev_v7/run_cube_dev.py --repo-root . --out artifacts/star50_fixed_cube_falsification_dev_v7
      - name: Guard falsification semantics
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/star50_fixed_cube_falsification_dev_v7/summary.json'))
          assert s['development_only'] and not s['validation_queried'] and not s['blackbox_queried'] and s['cell_count']==16
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: star50-fixed-cube-falsification-dev-v7-${{ github.run_id }}
          path: artifacts/star50_fixed_cube_falsification_dev_v7
          retention-days: 14
