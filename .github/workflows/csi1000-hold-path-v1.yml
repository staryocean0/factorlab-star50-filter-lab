name: csi1000-hold-path-v1
on:
  push:
    branches:
      - research/csi1000-hold-path-v1-20260908
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen holding-path inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/csi1000_hold_path_v1
            docs/research/csi1000_long_accel_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m/000852.SH
            data/cross_index_risk_gate_2026_v1/1m/000852.SH
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run frozen holding-path tests
        run: python -m pytest -q docs/research/csi1000_hold_path_v1/test_hold_path.py
      - name: Run frozen holding-path diagnostic
        run: python docs/research/csi1000_hold_path_v1/run_hold_path.py --repo-root . --out artifacts/csi1000_hold_path_v1
      - name: Guard candidate identity, horizons and blackbox absence
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='artifacts/csi1000_hold_path_v1'
          z=pd.read_csv(root+'/trade_paths.csv');s=json.load(open(root+'/summary.json'))
          assert s['candidate_counts']=={'Development':104,'Validation':129}
          assert s['blackbox_queried'] is False
          d=z[z.role=='Development'];v=z[z.role=='Validation']
          assert len(d)==104 and len(v)==129
          assert d.trading_day.astype(str).min()>='2021-01-01' and d.trading_day.astype(str).max()<='2023-12-31'
          assert v.trading_day.astype(str).min()>='2024-01-01' and v.trading_day.astype(str).max()<='2026-08-21'
          print('holding-path role guard: OK')
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/csi1000_hold_path_v1');rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload holding-path evidence
        uses: actions/upload-artifact@v4
        with:
          name: csi1000-hold-path-v1-${{ github.run_id }}
          path: artifacts/csi1000_hold_path_v1
          retention-days: 14
