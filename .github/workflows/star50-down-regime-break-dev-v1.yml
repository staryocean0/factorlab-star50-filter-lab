name: star50-down-regime-break-dev-v1
on:
  push:
    branches:
      - research/star50-down-regime-break-dev-v1-20260908
jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development-only STAR50 candidate inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/star50_down_regime_break_dev_v1
            docs/research/star50_highvol_mechanism_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m/000688.SH
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run candidate tests
        run: python -m pytest -q docs/research/star50_down_regime_break_dev_v1/test_dev.py
      - name: Run Development candidate test
        run: python docs/research/star50_down_regime_break_dev_v1/run_dev.py --repo-root . --out artifacts/star50_down_regime_break_dev_v1
      - name: Guard Development-only role
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='artifacts/star50_down_regime_break_dev_v1';z=pd.read_csv(root+'/dev_trades.csv');s=json.load(open(root+'/summary.json'))
          assert s['development_only'] is True and s['validation_queried'] is False and s['blackbox_queried'] is False
          assert z.trading_day.astype(str).min()>='2021-01-01' and z.trading_day.astype(str).max()<='2023-12-31'
          print('STAR50 candidate Development role guard: OK')
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/star50_down_regime_break_dev_v1');rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload Development candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: star50-down-regime-break-dev-v1-${{ github.run_id }}
          path: artifacts/star50_down_regime_break_dev_v1
          retention-days: 14
