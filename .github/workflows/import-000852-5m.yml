name: import-000852-5m

on:
  push:
    paths:
      - '.github/workflows/import-000852-5m.yml'

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy 000852.SH 5m yearly parquet shards
        shell: bash
        run: |
          set -euo pipefail
          dest='data/market/5m/000852.SH'
          mkdir -p "$dest"
          base='https://raw.githubusercontent.com/staryocean0/factorlab-trend-reversion-regime-lab/main/data/market/5m/000852.SH'
          for y in 2015 2016 2017 2018 2019 2020; do
            echo "fetching ${y}.parquet"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/${y}.parquet" \
              --output "$dest/${y}.parquet"
            test -s "$dest/${y}.parquet"
          done

          cat > "$dest/PROVENANCE.md" <<'EOF'
          # 000852.SH 5m data provenance

          These yearly Parquet shards were copied without transformation from:

          `staryocean0/factorlab-trend-reversion-regime-lab`

          Source paths:

          `data/market/5m/000852.SH/{2015..2020}.parquet`

          They are retained as yearly shards so cloud/connector tooling can read them directly without relying on the larger aggregated `data/development/5m_offset_0.parquet` file.
          EOF

      - name: Commit imported data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market/5m/000852.SH
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'data: import 000852.SH 5m yearly shards'
          git push
