name: degree-trajectory-persist-evidence

on:
  workflow_dispatch:
  push:
    branches: [research/degree-trajectory-utility-v1-20260912]
    paths:
      - '.github/workflows/degree-trajectory-persist-evidence.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/degree-trajectory-utility-v1-20260912
          fetch-depth: 0
      - name: Download decisive artifact exactly
        uses: actions/download-artifact@v4
        with:
          name: degree-trajectory-v1-validation-34680352701
          path: downloaded
          github-token: ${{ github.token }}
          run-id: 34680352701
      - name: Verify identities and copy evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum downloaded/VALIDATION_RESULTS.json | awk '{print $1}')" = "16e7db8b780f64cfa0fcc5091d3ab1feed4c63658465697381b2ae9dda390763"
          test "$(sha256sum downloaded/FROZEN_MODELS.json | awk '{print $1}')" = "04b49e8613cad5b24822f8e827f8d6513f6fef74da5c2df0851e03473b4db188"
          test "$(cat downloaded/MODEL_SHA256.txt)" = "04b49e8613cad5b24822f8e827f8d6513f6fef74da5c2df0851e03473b4db188"
          rm -rf research/degree_trajectory_utility_v1/evidence
          mkdir -p research/degree_trajectory_utility_v1/evidence
          cp -a downloaded/. research/degree_trajectory_utility_v1/evidence/
          cat > research/degree_trajectory_utility_v1/evidence/EVIDENCE_SOURCE.json <<'JSON'
          {
            "schema": "degree_trajectory_utility_v1_evidence_source",
            "decisive_run_id": 34680352701,
            "fit_job_id": 103517762036,
            "validation_job_id": 103517878447,
            "fit_artifact_id": 10293132822,
            "fit_artifact_zip_sha256": "01cb69405d54b2af333e9d4de768669c9ccf42f0f789b2cf0dfc01b78864b64c",
            "validation_artifact_id": 10294052627,
            "validation_artifact_bytes": 68727,
            "validation_artifact_zip_sha256": "60c9133dbf6632b2f7dcf9795c70038ed50f4d18718fc54aaf2378010ceaeba8",
            "validation_results_sha256": "16e7db8b780f64cfa0fcc5091d3ab1feed4c63658465697381b2ae9dda390763",
            "frozen_models_sha256": "04b49e8613cad5b24822f8e827f8d6513f6fef74da5c2df0851e03473b4db188",
            "source_artifact_copied_byte_for_byte": true,
            "validation_reused": true,
            "fresh_oos": false,
            "read_2026": false,
            "blackbox_queried": false,
            "pnl_computed": false,
            "production_authority": false
          }
          JSON
          python - <<'PY'
          import json
          p='research/degree_trajectory_utility_v1/evidence/VALIDATION_RESULTS.json'
          j=json.load(open(p))
          assert j['decision']=='ONE_STEP_DEGREE_TRAJECTORY_INCREMENTAL_UTILITY_NOT_SUPPORTED'
          assert not any(j['joint_endpoint_support'].values())
          assert j['model_sha256']=='04b49e8613cad5b24822f8e827f8d6513f6fef74da5c2df0851e03473b4db188'
          assert j['validation_reused'] is True and j['fresh_oos'] is False
          assert j['read_2026'] is False and j['blackbox_queried'] is False
          assert j['pnl_computed'] is False and j['production_authority'] is False
          print('decisive evidence verified')
          PY
      - name: Commit exact evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/degree_trajectory_utility_v1/evidence
          if git diff --cached --quiet; then
            echo 'evidence already persisted'
            exit 0
          fi
          git commit -m "research: persist decisive degree-trajectory evidence [skip ci]"
          git push origin HEAD:research/degree-trajectory-utility-v1-20260912
