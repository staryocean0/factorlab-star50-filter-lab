name: signed-risk-asymmetry-persist-evidence

on:
  workflow_dispatch:
  push:
    branches: [research/signed-risk-asymmetry-utility-v1-20260912]
    paths:
      - '.github/workflows/signed-risk-asymmetry-persist-evidence.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/signed-risk-asymmetry-utility-v1-20260912
          fetch-depth: 0
      - name: Download decisive artifact exactly
        uses: actions/download-artifact@v4
        with:
          name: signed-risk-asymmetry-v1-validation-34681733485
          path: downloaded
          github-token: ${{ github.token }}
          run-id: 34681733485
      - name: Verify identities and copy evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum downloaded/FROZEN_MODELS.json | awk '{print $1}')" = "92a5fdd5a75a57a1ca3adb567e8a12d03309c7de4ef33a601fc67cbb8c38f4d2"
          test "$(cat downloaded/MODEL_SHA256.txt)" = "92a5fdd5a75a57a1ca3adb567e8a12d03309c7de4ef33a601fc67cbb8c38f4d2"
          VALIDATION_SHA="$(sha256sum downloaded/VALIDATION_RESULTS.json | awk '{print $1}')"
          echo "VALIDATION_RESULTS_SHA256=${VALIDATION_SHA}"
          rm -rf research/signed_risk_asymmetry_utility_v1/evidence
          mkdir -p research/signed_risk_asymmetry_utility_v1/evidence
          cp -a downloaded/. research/signed_risk_asymmetry_utility_v1/evidence/
          VALIDATION_SHA="$VALIDATION_SHA" python - <<'PY'
          import json, os
          p='research/signed_risk_asymmetry_utility_v1/evidence/VALIDATION_RESULTS.json'
          j=json.load(open(p))
          decision='SIGNED_RETURN_ASYMMETRY_INCREMENTAL_UTILITY_NOT_SUPPORTED'
          assert j['decision']==decision
          assert not any(j['joint_endpoint_support'].values())
          assert j['model_sha256']=='92a5fdd5a75a57a1ca3adb567e8a12d03309c7de4ef33a601fc67cbb8c38f4d2'
          assert j['validation_reused'] is True and j['fresh_oos'] is False
          assert j['read_2026'] is False and j['blackbox_queried'] is False
          assert j['pnl_computed'] is False and j['production_authority'] is False
          rows={(r['horizon'],r['endpoint'],r['comparison']):r for r in j['comparisons']}
          for key in [(60,'log_future_sigma','A_vs_C'),(60,'log_future_sigma','A_vs_M')]:
              r=rows[key]
              assert r['relative_gain'] >= 0.01
              assert r['ci_5day']['low'] < 0
              assert r['slices']['symbol:000688.SH']['absolute_gain'] < 0
              assert r['slices']['symbol:000852.SH']['absolute_gain'] > 0
              assert r['supported'] is False
          source={
            'schema':'signed_risk_asymmetry_utility_v1_evidence_source',
            'decisive_run_id':34681733485,
            'fit_job_id':103521475450,
            'validation_job_id':103521623283,
            'fit_artifact_id':10294178564,
            'fit_artifact_bytes':26054,
            'fit_artifact_zip_sha256':'f7704e9e77163a6c7f977fb8d9007543d03b579aebf80ef5f403fb830a63a369',
            'validation_artifact_id':10293179281,
            'validation_artifact_bytes':67661,
            'validation_artifact_zip_sha256':'f9597bb93b91a481b6a07a225dfae22c90c2f9178216079f41e6053f3076af79',
            'validation_results_sha256':os.environ['VALIDATION_SHA'],
            'frozen_models_sha256':'92a5fdd5a75a57a1ca3adb567e8a12d03309c7de4ef33a601fc67cbb8c38f4d2',
            'protocol_git_blob':'8e5690d4fa1250fcc2e3b5cc3bfdea733dd46880',
            'runner_git_blob':'52fe22bef0b1e34364d908fc306fd076c8a20264',
            'parent_runner_git_blob':'0afc45e5061f45f544ecc7ee4519eae4e5204bca',
            'source_main_commit':'291d04861e85492337a2f86f1fade0419254972d',
            'source_artifact_copied_byte_for_byte':True,
            'validation_reused':True,
            'fresh_oos':False,
            'read_2026':False,
            'blackbox_queried':False,
            'pnl_computed':False,
            'production_authority':False,
          }
          with open('research/signed_risk_asymmetry_utility_v1/evidence/EVIDENCE_SOURCE.json','w') as f:
              json.dump(source,f,indent=2,sort_keys=True)
              f.write('\n')
          print(json.dumps({'decision':decision,'validation_results_sha256':os.environ['VALIDATION_SHA']},indent=2))
          PY
      - name: Commit exact evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/signed_risk_asymmetry_utility_v1/evidence
          if git diff --cached --quiet; then
            echo 'evidence already persisted'
            exit 0
          fi
          git commit -m "research: persist decisive signed-risk asymmetry evidence [skip ci]"
          git push origin HEAD:research/signed-risk-asymmetry-utility-v1-20260912
