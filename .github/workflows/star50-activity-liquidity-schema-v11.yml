name: star50-activity-liquidity-schema-v11
on:
  push:
    branches:
      - research/star50-activity-liquidity-dev-v11-20260908
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/cross_index_risk_gate_v1/1m/000688.SH/2021.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Print STAR50 Development schema
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/cross_index_risk_gate_v1/1m/000688.SH/2021.parquet'
          x=pd.read_parquet(p)
          print('COLUMNS',list(x.columns))
          print('DTYPES',{c:str(x[c].dtype) for c in x.columns})
          print('ROWS',len(x))
          PY
