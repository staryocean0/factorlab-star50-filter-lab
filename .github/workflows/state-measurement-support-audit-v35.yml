name: state-measurement-support-audit-v35
on:
  push:
    branches: ["research/state-measurement-support-audit-v35-20260908"]
    paths: [".github/workflows/state-measurement-support-audit-v35.yml"]
permissions:
  contents: read
concurrency:
  group: state-measurement-support-audit-v35
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_REF: d4c55741eb19684d86b2c771945acba17c842462
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout frozen audit and bounded two-index inputs
        uses: actions/checkout@v4
        with:
          ref: d4c55741eb19684d86b2c771945acba17c842462
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/state_measurement_support_audit_v35/
            /docs/research/first_shock_morphology_v3/code/morphology_v3.py
            /docs/research/first_shock_seconds_v2/code/seconds_v2.py
            /docs/research/first_shock_gate_v1/code/first_shock_gate.py
            /src/star50_filter/__init__.py
            /src/star50_filter/cloud_market_data.py
            /data/cross_index_risk_gate_v1/manifest.json
            /data/cross_index_risk_gate_v1/1m/000688.SH/202[2-5].parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/202[2-5].parquet
            /data/cross_index_risk_gate_3s_v1/manifest.json
            /data/cross_index_risk_gate_3s_v1/000688.SH_202[2-5].parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_202[2-5].parquet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          mkdir -p evidence/audit
          python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pyarrow pytest
          python -m pip freeze > evidence/environment.txt
      - name: Run frozen v3.5 tests
        run: |
          set -o pipefail
          python -m pytest -q docs/research/state_measurement_support_audit_v35/test_audit_v35.py --junitxml=evidence/tests.xml | tee evidence/tests.log
      - name: Run future-label-blind two-index audit
        run: |
          set -o pipefail
          python docs/research/state_measurement_support_audit_v35/audit_v35.py --repo-root . --out evidence/audit | tee evidence/audit.log
      - name: Seal evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence'); files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,
                                'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt={'workflow_sha':os.environ['GITHUB_SHA'],'research_ref':os.environ['RESEARCH_REF'],
                   'run_id':os.environ['GITHUB_RUN_ID'],'files':files,'future_labels_used':False,
                   'risk_gate_evaluated':False,'fresh_oos':False,'read_2026':False,
                   'production_authority':False}
          (root/'run_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=root/'audit/summary.json'
          if p.exists(): print('STATE_MEASUREMENT_AUDIT_SUMMARY '+p.read_text())
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-measurement-support-audit-v35-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
