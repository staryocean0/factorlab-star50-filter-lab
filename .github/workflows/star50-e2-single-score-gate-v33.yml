# execution trigger only; scientific ref remains frozen below
name: star50-e2-single-score-gate-v33
on:
  push:
    branches: ["research/star50-e2-single-score-gate-v33-actions-20260907"]
    paths: [".github/workflows/star50-e2-single-score-gate-v33.yml"]
permissions:
  contents: read
concurrency:
  group: star50-e2-single-score-gate-v33
  cancel-in-progress: false
jobs:
  gate-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESEARCH_REF: b435818a85048327bc099a6c358fb26719c09f56
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout frozen V3.3 code and bounded STAR50 inputs only
        uses: actions/checkout@v4
        with:
          ref: b435818a85048327bc099a6c358fb26719c09f56
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/first_shock_morphology_v3/
            /docs/research/first_shock_seconds_v2/code/
            /docs/research/first_shock_gate_v1/code/
            /src/star50_filter/__init__.py
            /src/star50_filter/cloud_market_data.py
            /data/cross_index_risk_gate_v1/manifest.json
            /data/cross_index_risk_gate_v1/1m/000688.SH/202[2-5].parquet
            /data/cross_index_risk_gate_3s_v1/manifest.json
            /data/cross_index_risk_gate_3s_v1/000688.SH_202[2-5].parquet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          mkdir -p evidence/v33
          python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pyarrow pytest
          python -m pip freeze > evidence/environment.txt
      - name: Run inherited V3.2 plus V3.3 tests
        run: |
          set -o pipefail
          python -m pytest -q \
            docs/research/first_shock_morphology_v3/tests/test_precursor_existence_v32.py \
            docs/research/first_shock_morphology_v3/tests/test_single_score_gate_v33.py \
            --junitxml=evidence/tests.xml | tee evidence/tests.log
      - name: Run frozen V3.3 fixed-budget feasibility
        run: |
          set -o pipefail
          python docs/research/first_shock_morphology_v3/code/single_score_gate_v33.py \
            --repo-root . \
            --research-ref "$RESEARCH_REF" \
            --out evidence/v33 | tee evidence/v33.log
      - name: Seal evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence');files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,
                                'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt={'workflow_sha':os.environ['GITHUB_SHA'],'research_ref':os.environ['RESEARCH_REF'],
                   'run_id':os.environ['GITHUB_RUN_ID'],'files':files,
                   'fresh_oos':False,'returns_or_pnl_evaluated':False,'production_authority':False}
          (root/'workflow_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=root/'v33/summary_v33.json'
          if p.exists(): print('V33_SUMMARY '+p.read_text())
          PY
      - name: Upload V3.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star50-e2-single-score-gate-v33-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/environment.txt
            evidence/tests.xml
            evidence/tests.log
            evidence/v33.log
            evidence/workflow_receipt.json
            evidence/v33/*.json
            evidence/v33/*.csv
