name: star50-down-regime-break-v2-dev
on:
  push:
    branches:
      - research/star50-down-regime-break-v2-20260908
    paths:
      - docs/research/star50_down_regime_break_v2/candidate.json
      - docs/research/star50_down_regime_break_v2/run_dev.py
      - docs/research/star50_down_regime_break_v2/test_dev.py
jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen candidate and Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/star50_down_regime_break_v2
            docs/research/star50_highvol_mechanism_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/cross_index_risk_gate_v1/1m/000688.SH/2020.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2021.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2022.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2023.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard physical Development-only checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(p.name for p in Path('data/cross_index_risk_gate_v1/1m/000688.SH').glob('*.parquet'))
          assert files == ['2020.parquet','2021.parquet','2022.parquet','2023.parquet'], files
          print('physical data checkout:', files)
          PY
      - name: Run frozen candidate tests
        run: python -m pytest -q docs/research/star50_down_regime_break_v2/test_dev.py
      - name: Run formal Development rerun
        run: python docs/research/star50_down_regime_break_v2/run_dev.py --repo-root . --out artifacts/star50_down_regime_break_v2_dev
      - name: Guard candidate identity and Development role
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          root='artifacts/star50_down_regime_break_v2_dev'
          s=json.load(open(root+'/summary.json'))
          z=pd.read_csv(root+'/dev_trades.csv')
          a=pd.read_csv(root+'/annual.csv')
          assert s['development_only'] is True
          assert s['validation_queried'] is False
          assert s['blackbox_queried'] is False
          assert s['candidate']=={
            'direction':'short','slow30_sign':'positive','net5_sign':'negative',
            'efficiency5_min':0.6,'tail2_share_min':0.5,'tail1_condition':None,'hold_min':3}
          assert list(a['year']) == [2021,2022,2023]
          if len(z):
            d=z.trading_day.astype(str)
            assert d.min()>='2021-01-01' and d.max()<='2023-12-31'
          print(json.dumps({'acceptance':s['acceptance'],'pooled':s['pooled']},indent=2))
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/star50_down_regime_break_v2_dev');rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload Development evidence
        uses: actions/upload-artifact@v4
        with:
          name: star50-down-regime-break-v2-dev-${{ github.run_id }}
          path: artifacts/star50_down_regime_break_v2_dev
          retention-days: 14
