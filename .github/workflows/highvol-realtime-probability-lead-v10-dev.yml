name: highvol-realtime-probability-lead-v10-development
on:
  push:
    branches:
      - research/highvol-realtime-probability-lead-v10-20260910
    paths:
      - .github/workflows/highvol-realtime-probability-lead-v10-dev.yml
      - research/highvol_realtime_probability_lead_v10/**
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/highvol_realtime_probability_lead_v10
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/market/5m/000688.SH/2020.parquet
            data/market/5m/000688.SH/2021.parquet
            data/market/5m/000688.SH/2022.parquet
            data/market/5m/000688.SH/2023.parquet
            data/market/5m/000852.SH/2020.parquet
            data/market/5m/000852.SH/2021.parquet
            data/market/5m/000852.SH/2022.parquet
            data/market/5m/000852.SH/2023.parquet
            data/cross_index_risk_gate_3s_v1/000688.SH_2021.parquet
            data/cross_index_risk_gate_3s_v1/000688.SH_2022.parquet
            data/cross_index_risk_gate_3s_v1/000688.SH_2023.parquet
            data/cross_index_risk_gate_3s_v1/000852.SH_2021.parquet
            data/cross_index_risk_gate_3s_v1/000852.SH_2022.parquet
            data/cross_index_risk_gate_3s_v1/000852.SH_2023.parquet
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest
      - name: Validate governance
        run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard Development boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          for s in ['000688.SH','000852.SH']:
              assert sorted(p.name for p in (Path('data/market/5m')/s).glob('*.parquet'))==[f'{y}.parquet' for y in range(2020,2024)]
          got=sorted(p.name for p in Path('data/cross_index_risk_gate_3s_v1').glob('*.parquet'))
          exp=sorted([f'{s}_{y}.parquet' for s in ['000688.SH','000852.SH'] for y in [2021,2022,2023]])
          assert got==exp,(got,exp)
          assert not list(Path('data').rglob('2024.parquet'))
          assert not list(Path('data').rglob('2025.parquet'))
          assert not list(Path('data').rglob('2026.parquet'))
          PY
      - name: Materialize exact frozen V9 runner
        run: |
          git fetch --depth=1 origin e01b293dcfc3100a02265315376bc63a9137c3d3
          git show e01b293dcfc3100a02265315376bc63a9137c3d3:research/highvol_realtime_risk_object_v9/run_v9.py > research/highvol_realtime_probability_lead_v10/frozen_v9.py
          test "$(git hash-object research/highvol_realtime_probability_lead_v10/frozen_v9.py)" = "ae2a7e095df58692ef9df0dfee5856cac727ca44"
      - name: Test frozen V10 contract
        run: python -m pytest -q research/highvol_realtime_probability_lead_v10/test_v10.py
      - name: Run V10 fixed lead curve
        run: python research/highvol_realtime_probability_lead_v10/run_v10.py --repo-root . --out artifacts/highvol_realtime_probability_lead_v10
      - name: Guard research-only role
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/highvol_realtime_probability_lead_v10/summary.json'))
          assert s['development_only'] is True
          assert s['validation_queried'] is False
          assert s['blackbox_queried'] is False
          assert s['probability_fit_performed'] is False
          assert s['threshold_search_performed'] is False
          assert s['pnl_computed'] is False
          assert s['trading_rule_created'] is False
          assert s['production_authority'] is False
          print('lead15 validation eligible:',s['lead15_validation_eligible'])
          print(json.dumps(s['acceptance'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: highvol-realtime-probability-lead-v10-${{ github.run_id }}
          path: artifacts/highvol_realtime_probability_lead_v10
          retention-days: 30
