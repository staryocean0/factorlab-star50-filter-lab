name: star50-filter-lab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            !/artifacts/
            !/research_materials/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install one bounded environment
        run: python -m pip install -e '.[maintenance]'
      - name: Verify complete lifecycle and current document consistency
        run: |
          mkdir -p /tmp/star50-validation
          set -o pipefail
          python scripts/repository_consistency.py check | tee /tmp/star50-validation/consistency.json
          python -m pip freeze > /tmp/star50-validation/environment.txt
      - name: Preserve existing governance and frozen authority gates
        run: |
          python - <<'PY'
          import json, subprocess, sys
          state=json.load(open('docs/governance/REPOSITORY_STATE.json'))
          for path in state['authority_validators']:
              subprocess.run([sys.executable,path],check=True)
          PY
      - name: Synthetic compatibility and maintenance regressions
        run: python -m pytest -q -rs --junitxml=/tmp/star50-validation/root-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-validation-${{ github.run_id }}
          path: /tmp/star50-validation/
          retention-days: 90
          if-no-files-found: error
  frozen-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            !/artifacts/
            !/research_materials/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[maintenance]'
      - name: Run every registered research test in its own process
        run: python scripts/repository_consistency.py tests --out /tmp/star50-contract-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-contract-tests-${{ github.run_id }}
          path: /tmp/star50-contract-tests/
          retention-days: 90
          if-no-files-found: error
