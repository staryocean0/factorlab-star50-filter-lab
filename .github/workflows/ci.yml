name: star50-filter-lab
on:
  push:
  pull_request:
jobs:
  validate:
    # Temporary execution-branch guard; restore original bytes after D2 evidence.
    # D2 uses its own bounded checkout and explicit tests, not the whole data tree.
    if: github.ref != 'refs/heads/delivery/causal-kline-state-v1-20260911' && github.head_ref != 'delivery/causal-kline-state-v1-20260911'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: python scripts/validate_data_usage_policy.py
      - run: python -m pytest -q
