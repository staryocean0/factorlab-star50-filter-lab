name: star50-filter-lab
on:
  push:
  pull_request:
jobs:
  validate:
    if: github.ref != 'refs/heads/research/d3-risk-bucket-utility-20260912'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: python scripts/validate_data_usage_policy.py
      - run: python -m pytest -q
