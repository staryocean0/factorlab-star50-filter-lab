name: star50-filter-lab
on:
  push:
    branches-ignore: ["research/direction-stability-actions-20260907"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: python -m pytest -q
      - run: python scripts/validate_drawdown_study.py
