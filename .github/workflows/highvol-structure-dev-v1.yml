name: highvol-structure-dev-v1
on:
  push:
    branches:
      - research/highvol-onset-path-v1-20260908
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development diagnostic inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/highvol_structure_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run causal development tests
        run: python -m pytest -q docs/research/highvol_structure_dev_v1/test_dev_structure.py docs/research/continuous_vol_regime_v1/test_continuous_vol_regime.py
      - name: Build development-only structure map
        run: python docs/research/highvol_structure_dev_v1/run_dev_structure.py --repo-root . --out artifacts/highvol_structure_dev_v1
      - name: Guard against validation leakage
        run: |
          python - <<'PY'
          import pandas as pd
          p='artifacts/highvol_structure_dev_v1/development_onsets.csv'
          z=pd.read_csv(p)
          assert int(z['year'].max()) <= 2023
          assert int(z['year'].min()) >= 2021
          print('development-only guard: OK')
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/highvol_structure_dev_v1'); rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes(); rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: highvol-structure-dev-v1-${{ github.run_id }}
          path: artifacts/highvol_structure_dev_v1
          retention-days: 14
