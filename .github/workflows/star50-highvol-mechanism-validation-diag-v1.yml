name: star50-highvol-mechanism-validation-diag-v1
on:
  push:
    branches:
      - research/star50-highvol-mechanism-validation-diag-v1-20260908
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development and Validation diagnostic inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/star50_highvol_mechanism_validation_diag_v1
            docs/research/star50_highvol_mechanism_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m/000688.SH
            data/cross_index_risk_gate_2026_v1/1m/000688.SH
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run diagnostic tests
        run: python -m pytest -q docs/research/star50_highvol_mechanism_validation_diag_v1/test_diag.py docs/research/star50_highvol_mechanism_dev_v1/test_mechanism.py
      - name: Run reusable Validation mechanism diagnostic
        run: python docs/research/star50_highvol_mechanism_validation_diag_v1/run_diag.py --repo-root . --out artifacts/star50_highvol_mechanism_validation_diag_v1
      - name: Guard horizon and blackbox absence
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='artifacts/star50_highvol_mechanism_validation_diag_v1';e=pd.read_csv(root+'/validation_events.csv');s=json.load(open(root+'/summary.json'))
          if len(e):
              assert e.trading_day.astype(str).min()>='2024-01-01' and e.trading_day.astype(str).max()<='2026-08-21'
          assert s['blackbox_queried'] is False and s['candidate_nominated'] is False
          print('STAR50 Validation diagnostic role guard: OK')
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/star50_highvol_mechanism_validation_diag_v1');rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload Validation diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: star50-highvol-mechanism-validation-diag-v1-${{ github.run_id }}
          path: artifacts/star50_highvol_mechanism_validation_diag_v1
          retention-days: 14
