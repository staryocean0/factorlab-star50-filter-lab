name: csi1000-confirmation-dev-v1
on:
  push:
    branches:
      - research/csi1000-confirmation-dev-v1-20260908
jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/csi1000_confirmation_dev_v1
            docs/research/csi1000_long_accel_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m/000852.SH
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run confirmation tests
        run: python -m pytest -q docs/research/csi1000_confirmation_dev_v1/test_confirmation.py
      - name: Run Development confirmation comparison
        run: python docs/research/csi1000_confirmation_dev_v1/run_confirmation.py --repo-root . --out artifacts/csi1000_confirmation_dev_v1
      - name: Guard Development-only role
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='artifacts/csi1000_confirmation_dev_v1';s=json.load(open(root+'/summary.json'))
          assert s['development_only'] is True and s['validation_queried'] is False and s['blackbox_queried'] is False
          z=pd.read_csv(root+'/trades.csv');assert z.trading_day.astype(str).max()<='2023-12-31'
          print('confirmation Development role guard: OK')
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/csi1000_confirmation_dev_v1');rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload Development evidence
        uses: actions/upload-artifact@v4
        with:
          name: csi1000-confirmation-dev-v1-${{ github.run_id }}
          path: artifacts/csi1000_confirmation_dev_v1
          retention-days: 14
