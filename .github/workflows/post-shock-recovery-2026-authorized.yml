name: post-shock-recovery-2026-authorized
on:
  push:
    branches: ["research/post-shock-recovery-2026-actions-20260907"]
    paths: [".github/workflows/post-shock-recovery-2026-authorized.yml"]
permissions:
  contents: read
concurrency:
  group: post-shock-recovery-2026-authorized
  cancel-in-progress: false
jobs:
  held-out-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout only authorized 2026 validation inputs and frozen runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/post_shock_recovery_2026/
            /data/cross_index_risk_gate_2026_v1/manifest.json
            /data/cross_index_risk_gate_2026_v1/1m/000688.SH/2026.parquet
            /data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet
            /data/cross_index_risk_gate_2026_3s_v1/manifest.json
            /data/cross_index_risk_gate_2026_3s_v1/000688.SH_2026.parquet
            /data/cross_index_risk_gate_2026_3s_v1/000852.SH_2026.parquet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fixed validation dependencies
        run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pyarrow
          mkdir -p evidence
          python -m pip freeze > evidence/environment.txt
      - name: Compile runner
        run: python -m py_compile docs/research/post_shock_recovery_2026/validate_2026.py
      - name: Run held-out 2026 recovery validation
        run: |
          set -o pipefail
          python docs/research/post_shock_recovery_2026/validate_2026.py --root . --out evidence/recovery2026 | tee evidence/run.log
      - name: Seal output manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps(rows,indent=2)+'\n')
          s=root/'recovery2026/summary_2026.json'
          if s.exists(): print('FINAL_SUMMARY '+s.read_text())
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-shock-recovery-2026-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
