name: csi1000-delay-decay-v1
on:
  push:
    branches:
      - research/csi1000-delay-decay-v1-20260908
jobs:
  delay-decay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen delay-decay inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/csi1000_delay_decay_v1
            docs/research/csi1000_long_accel_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m/000852.SH
            data/cross_index_risk_gate_2026_v1/1m/000852.SH
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run frozen delay-decay tests
        run: python -m pytest -q docs/research/csi1000_delay_decay_v1/test_delay_decay.py
      - name: Run within-event delay-decay study
        run: python docs/research/csi1000_delay_decay_v1/run_delay_decay.py --repo-root . --out artifacts/csi1000_delay_decay_v1
      - name: Guard candidate counts, horizon and blackbox absence
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='artifacts/csi1000_delay_decay_v1';s=json.load(open(root+'/summary.json'))
          assert s['blackbox_queried'] is False
          assert s['candidate']=={'slow_window':30,'tail2_min':0.6,'tail1_cap':0.6,'hold_min':3,'direction':'long'}
          assert s['delays']==[0,1,2,3,5]
          assert s['counts']=={'development_candidates':104,'validation_candidates':129},s['counts']
          z=pd.read_csv(root+'/delay_rows.csv');assert z.trading_day.astype(str).min()>='2021-01-01';assert z.trading_day.astype(str).max()<='2026-08-21'
          print('delay-decay role guard: OK')
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/csi1000_delay_decay_v1');rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload delay-decay evidence
        uses: actions/upload-artifact@v4
        with:
          name: csi1000-delay-decay-v1-${{ github.run_id }}
          path: artifacts/csi1000_delay_decay_v1
          retention-days: 14
