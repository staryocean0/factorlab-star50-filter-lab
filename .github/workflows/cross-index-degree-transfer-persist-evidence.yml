name: cross-index-degree-transfer-persist-evidence

on:
  workflow_dispatch:
  push:
    branches: [research/cross-index-degree-transfer-utility-v1-20260912]
    paths:
      - '.github/workflows/cross-index-degree-transfer-persist-evidence.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cross-index-degree-transfer-utility-v1-20260912
          fetch-depth: 0
      - name: Download decisive artifact exactly
        uses: actions/download-artifact@v4
        with:
          name: cross-index-degree-v1-frozen-validation-34677297901
          path: downloaded
          github-token: ${{ github.token }}
          run-id: 34677297901
      - name: Verify decisive identities and copy evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum downloaded/VALIDATION_RESULTS.json | awk '{print $1}')" = "01780af3bcee5d087eb3af4ea02739a210a28b1cd211e08892a5be1de2b4664f"
          test "$(sha256sum downloaded/FROZEN_MODELS.json | awk '{print $1}')" = "7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6"
          test "$(cat downloaded/MODEL_SHA256.txt)" = "7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6"
          rm -rf research/cross_index_degree_transfer_utility_v1/evidence
          mkdir -p research/cross_index_degree_transfer_utility_v1/evidence
          cp -a downloaded/. research/cross_index_degree_transfer_utility_v1/evidence/
          cat > research/cross_index_degree_transfer_utility_v1/evidence/EVIDENCE_SOURCE.json <<'JSON'
          {
            "schema": "cross_index_degree_transfer_utility_v1_evidence_source",
            "decisive_run_id": 34677297901,
            "decisive_job_id": 103509323551,
            "artifact_id": 10292433776,
            "artifact_bytes": 65330,
            "artifact_zip_sha256": "1ab8a12d77beb15c7aba5880a588c3475dc7d6270ca121eb95056ef9aa56ba92",
            "validation_results_sha256": "01780af3bcee5d087eb3af4ea02739a210a28b1cd211e08892a5be1de2b4664f",
            "frozen_models_sha256": "7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6",
            "source_artifact_copied_byte_for_byte": true,
            "validation_reused": true,
            "fresh_oos": false,
            "read_2026": false,
            "blackbox_queried": false,
            "pnl_computed": false,
            "production_authority": false
          }
          JSON
          python - <<'PY'
          import json
          p='research/cross_index_degree_transfer_utility_v1/evidence/VALIDATION_RESULTS.json'
          j=json.load(open(p))
          assert j['decision']=='CROSS_INDEX_CURRENT_DEGREE_INCREMENTAL_UTILITY_NOT_SUPPORTED'
          assert not any(j['joint_endpoint_support'].values())
          assert j['model_sha256']=='7eae7142323b38c5ae54618745e9ad9891c00afb09d02e8eb8def4490675f6b6'
          assert j['validation_reused'] is True and j['fresh_oos'] is False
          assert j['read_2026'] is False and j['blackbox_queried'] is False
          assert j['pnl_computed'] is False and j['production_authority'] is False
          print('decisive evidence verified')
          PY
      - name: Commit exact evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cross_index_degree_transfer_utility_v1/evidence
          if git diff --cached --quiet; then
            echo 'evidence already persisted'
            exit 0
          fi
          git commit -m "research: persist decisive cross-index degree evidence [skip ci]"
          git push origin HEAD:research/cross-index-degree-transfer-utility-v1-20260912
