name: first-shock-event-support-census-v36
on:
  push:
    branches: ["research/first-shock-event-support-census-v36-20260908"]
    paths: [".github/workflows/first-shock-event-support-census-v36.yml"]
permissions:
  contents: read
concurrency:
  group: first-shock-event-support-census-v36
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_REF: 4e4d016337b22e7dde96ab5b046e23556fc92e40
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout frozen census and bounded 1m inputs
        uses: actions/checkout@v4
        with:
          ref: 4e4d016337b22e7dde96ab5b046e23556fc92e40
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/first_shock_event_support_census_v36/
            /docs/research/first_shock_gate_v1/code/first_shock_gate.py
            /src/star50_filter/__init__.py
            /src/star50_filter/cloud_market_data.py
            /data/cross_index_risk_gate_v1/manifest.json
            /data/cross_index_risk_gate_v1/1m/000688.SH/202[2-5].parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/202[2-5].parquet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          mkdir -p evidence/census
          python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pyarrow pytest
          python -m pip freeze > evidence/environment.txt
      - name: Run frozen v3.6 tests
        run: |
          set -o pipefail
          python -m pytest -q docs/research/first_shock_event_support_census_v36/test_census_v36.py --junitxml=evidence/tests.xml | tee evidence/tests.log
      - name: Run frozen event-support census
        run: |
          set -o pipefail
          python docs/research/first_shock_event_support_census_v36/census_v36.py --repo-root . --out evidence/census | tee evidence/census.log
      - name: Seal evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence'); files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,
                                'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt={'workflow_sha':os.environ['GITHUB_SHA'],'research_ref':os.environ['RESEARCH_REF'],
                   'run_id':os.environ['GITHUB_RUN_ID'],'files':files,
                   'predictor_defined':False,'v32_scale_score_used':False,
                   'fresh_oos':False,'read_2026':False,'production_authority':False}
          (root/'run_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=root/'census/summary.json'
          if p.exists(): print('EVENT_SUPPORT_CENSUS_SUMMARY '+p.read_text())
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-shock-event-support-census-v36-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
