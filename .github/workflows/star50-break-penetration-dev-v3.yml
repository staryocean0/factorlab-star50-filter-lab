name: star50-break-penetration-dev-v3
on:
  push:
    branches:
      - research/star50-break-penetration-dev-v3-20260908
jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/star50_break_penetration_dev_v3
            docs/research/star50_highvol_mechanism_dev_v1
            docs/research/continuous_vol_regime_v1
            docs/research/state_conditioned_frequency_v2
            src/star50_filter/filters.py
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/cross_index_risk_gate_v1/1m/000688.SH/2020.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2021.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2022.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2023.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard physical Development-only checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(p.name for p in Path('data/cross_index_risk_gate_v1/1m/000688.SH').glob('*.parquet'))
          assert files==['2020.parquet','2021.parquet','2022.parquet','2023.parquet'],files
          assert not Path('data/cross_index_risk_gate_2026_v1').exists()
          print('Development-only files:',files)
          PY
      - name: Run preregistered tests
        run: python -m pytest -q docs/research/star50_break_penetration_dev_v3/test_penetration_dev.py
      - name: Run Development mechanism map
        run: python docs/research/star50_break_penetration_dev_v3/run_penetration_dev.py --repo-root . --out artifacts/star50_break_penetration_dev_v3
      - name: Guard role and print threshold gates
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/star50_break_penetration_dev_v3/summary.json'))
          assert s['development_only'] is True and s['validation_queried'] is False and s['blackbox_queried'] is False
          assert s['natural_thresholds']==[0.5,1.0,2.0]
          print(json.dumps({'candidate_nominated':s['candidate_nominated'],'nominated_threshold':s['nominated_threshold'],'threshold_gates':s['threshold_gates']},indent=2))
          PY
      - name: Upload Development evidence
        uses: actions/upload-artifact@v4
        with:
          name: star50-break-penetration-dev-v3-${{ github.run_id }}
          path: artifacts/star50_break_penetration_dev_v3
          retention-days: 14
