name: highvol-recovery-calibration-v4-development

on:
  push:
    branches:
      - research/highvol-recovery-calibration-v4-20260910
    paths:
      - research/highvol_recovery_hazard_v3/**
      - research/highvol_recovery_calibration_v4/**
      - .github/workflows/highvol-recovery-calibration-v4-dev.yml

jobs:
  development-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen v3/v4 code and Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/highvol_recovery_hazard_v3
            research/highvol_recovery_calibration_v4
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/market/5m/000688.SH/2020.parquet
            data/market/5m/000688.SH/2021.parquet
            data/market/5m/000688.SH/2022.parquet
            data/market/5m/000688.SH/2023.parquet
            data/market/5m/000852.SH/2020.parquet
            data/market/5m/000852.SH/2021.parquet
            data/market/5m/000852.SH/2022.parquet
            data/market/5m/000852.SH/2023.parquet
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest
      - run: python scripts/validate_data_usage_policy.py --repo-root .

      - name: Guard physical Development boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          for symbol in ['000688.SH','000852.SH']:
              got=sorted(p.name for p in (Path('data/market/5m')/symbol).glob('*.parquet'))
              assert got == ['2020.parquet','2021.parquet','2022.parquet','2023.parquet'], (symbol,got)
          assert not list(Path('data').rglob('2024.parquet'))
          assert not list(Path('data').rglob('2025.parquet'))
          assert not list(Path('data').rglob('2026.parquet'))
          print('Development boundary: OK')
          PY

      - run: python -m pytest -q research/highvol_recovery_hazard_v3/test_hazard.py research/highvol_recovery_calibration_v4/test_calibration.py
      - run: python research/highvol_recovery_calibration_v4/run_calibration.py --repo-root . --out artifacts/highvol_recovery_calibration_v4

      - name: Guard frozen candidate eligibility semantics
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/highvol_recovery_calibration_v4/summary.json'))
          assert s['state_thresholds_unchanged'] is True
          assert s['pnl_computed'] is False
          assert s['trading_rule_created'] is False
          assert s['validation_queried'] is False
          assert s['blackbox_queried'] is False
          assert s['production_authority'] is False
          assert len(s['frozen_map']) == 8
          print('candidate eligible:', s['calibration_candidate_eligible'])
          print(json.dumps(s['acceptance'], sort_keys=True))
          PY

      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/highvol_recovery_calibration_v4'); files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes(); files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'schema':'highvol_recovery_calibration_v4_dev_manifest','files':files},indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: highvol-recovery-calibration-v4-${{ github.run_id }}
          path: artifacts/highvol_recovery_calibration_v4
          retention-days: 30
