name: measurement-support-audit
on:
  push:
    branches: ["research/measurement-support-audit-20260907"]
    paths: [".github/workflows/measurement-support-audit.yml"]
permissions:
  contents: read
concurrency:
  group: measurement-support-audit
  cancel-in-progress: false
jobs:
  bounded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/measurement_support_audit_v1/
            /docs/research/first_shock_gate_v1/
            /docs/research/first_shock_seconds_v2/
            /src/star50_filter/__init__.py
            /src/star50_filter/cloud_market_data.py
            /data/cross_index_risk_gate_v1/manifest.json
            /data/cross_index_risk_gate_v1/1m/000688.SH/202[1-5].parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/202[1-5].parquet
            /data/cross_index_risk_gate_3s_v1/manifest.json
            /data/cross_index_risk_gate_3s_v1/primary_acceptance.json
            /data/cross_index_risk_gate_3s_v1/000688.SH_202[1-5].parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_202[1-5].parquet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies and verify audit delivery
        run: |
          mkdir -p evidence
          python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pytest pyarrow
          python -m pip freeze > evidence/environment.txt
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('docs/research/measurement_support_audit_v1')
          for x in json.loads((root/'delivery.json').read_text()):
              p=root/x['path'];d=p.read_bytes()
              assert len(d)==x['bytes'] and hashlib.sha256(d).hexdigest()==x['sha256'],x['path']
          print('AUDIT_DELIVERY_MATCHED')
          PY
      - name: Test new audit functions
        run: |
          set -o pipefail
          python -m pytest -q docs/research/measurement_support_audit_v1/tests --junitxml=evidence/tests.xml | tee evidence/tests.log
      - name: Trace exact sample loss and pre-event states without model fitting
        run: |
          set -o pipefail
          python docs/research/measurement_support_audit_v1/support_audit.py --root . --out evidence/audit | tee evidence/audit.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-support-audit-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
