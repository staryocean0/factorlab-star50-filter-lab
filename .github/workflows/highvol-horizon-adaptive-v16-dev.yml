name: highvol-horizon-adaptive-v16-development
on:
  push:
    branches:
      - research/highvol-horizon-adaptive-surface-v16-20260910
    paths:
      - .github/workflows/highvol-horizon-adaptive-v16-dev.yml
      - research/highvol_horizon_adaptive_v16/**

jobs:
  build-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V16 lineage and Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/highvol_horizon_adaptive_v16
            research/highvol_horizon_composite_v15
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/market/5m/000688.SH/2020.parquet
            data/market/5m/000688.SH/2021.parquet
            data/market/5m/000688.SH/2022.parquet
            data/market/5m/000688.SH/2023.parquet
            data/market/5m/000852.SH/2020.parquet
            data/market/5m/000852.SH/2021.parquet
            data/market/5m/000852.SH/2022.parquet
            data/market/5m/000852.SH/2023.parquet
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest

      - name: Materialize exact frozen V11 cohort builder
        run: |
          git fetch --no-tags --depth=1 origin research/highvol-recovery-survival-v11-20260910
          test "$(git rev-parse FETCH_HEAD)" = "30fda623af5c9461ffe60c4985e6150f01eec8f8"
          mkdir -p research/highvol_recovery_survival_v11
          git show FETCH_HEAD:research/highvol_recovery_survival_v11/run_survival.py > research/highvol_recovery_survival_v11/run_survival.py
          test "$(git hash-object research/highvol_recovery_survival_v11/run_survival.py)" = "713f0dcc41e7f32f75934fc7709a406ff71579e6"

      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .

      - name: Guard physical Development boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          for symbol in ['000688.SH','000852.SH']:
              got=sorted(p.name for p in (Path('data/market/5m')/symbol).glob('*.parquet'))
              assert got==['2020.parquet','2021.parquet','2022.parquet','2023.parquet'],(symbol,got)
          assert not list(Path('data').rglob('2024.parquet'))
          assert not list(Path('data').rglob('2025.parquet'))
          assert not list(Path('data').rglob('2026.parquet'))
          print('V16 Development physical boundary: OK')
          PY

      - name: Test frozen V16 construction
        run: python -m pytest -q research/highvol_horizon_adaptive_v16/test_surface.py

      - name: Run V16 horizon-adaptive surface
        run: python research/highvol_horizon_adaptive_v16/run_surface.py --repo-root . --out artifacts/highvol_horizon_adaptive_v16

      - name: Guard risk-only role
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/highvol_horizon_adaptive_v16/summary.json'))
          assert s['development_only'] is True
          assert s['validation_informed_hypothesis'] is True
          assert s['row_count']==7327
          assert s['horizons_minutes']==[15,30,60]
          assert s['threshold_search_performed'] is False
          assert s['parameter_change_performed'] is False
          assert s['validation_queried'] is False
          assert s['blackbox_queried'] is False
          assert s['pnl_computed'] is False
          assert s['trading_rule_created'] is False
          assert s['production_authority'] is False
          print('V16 adaptive surface supported:',s['adaptive_surface_supported'])
          print(json.dumps(s['acceptance'],sort_keys=True))
          print(json.dumps(s['pooled_leave_one_year_out'],sort_keys=True))
          print(json.dumps(s['full_development_surface'],sort_keys=True))
          PY

      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/highvol_horizon_adaptive_v16'); files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes(); files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'schema':'highvol_horizon_adaptive_v16_dev_manifest','files':files},indent=2)+'\n')
          PY

      - name: Upload V16 evidence
        uses: actions/upload-artifact@v4
        with:
          name: highvol-horizon-adaptive-v16-${{ github.run_id }}
          path: artifacts/highvol_horizon_adaptive_v16
          retention-days: 30
