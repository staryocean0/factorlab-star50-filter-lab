name: star50-cross-confirm-validation-diag
on:
  push:
    branches:
      - research/star50-down-regime-break-v2-20260908
    paths:
      - .github/workflows/star50-cross-confirm-validation-diag.yml
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reusable Validation inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/star50_down_regime_break_v2/candidate.json
            docs/research/star50_down_regime_break_v2/run_dev.py
            docs/research/star50_down_regime_break_v2/run_cross_confirm_diag.py
            docs/research/star50_highvol_mechanism_dev_v1/run_mechanism.py
            docs/research/continuous_vol_regime_v1/run_continuous_vol_regime.py
            docs/research/state_conditioned_frequency_v2/code/run_physical_scale_strategy.py
            docs/research/state_conditioned_frequency_v2/code/fast_grid.py
            src/star50_filter/filters.py
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/cross_index_risk_gate_v1/1m/000688.SH/2024.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2025.parquet
            data/cross_index_risk_gate_v1/1m/000852.SH/2024.parquet
            data/cross_index_risk_gate_v1/1m/000852.SH/2025.parquet
            data/cross_index_risk_gate_2026_v1/manifest.json
            data/cross_index_risk_gate_2026_v1/1m/000688.SH/2026.parquet
            data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn
      - name: Validate governance and cutoff
        run: |
          python scripts/validate_data_usage_policy.py --repo-root .
          python - <<'PY'
          import json
          m=json.load(open('data/cross_index_risk_gate_2026_v1/manifest.json'))
          assert m['actual_last_day']=='2026-08-21' and m['post_snapshot_rows']==0
          PY
      - name: Run cross-index Validation diagnostic
        run: python docs/research/star50_down_regime_break_v2/run_cross_confirm_diag.py --repo-root . --out artifacts/star50_cross_confirm_validation_diag
      - name: Guard diagnostic-only semantics
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/star50_cross_confirm_validation_diag/summary.json'))
          assert s['diagnostic_only'] is True and s['candidate_validation_claim'] is False and s['blackbox_queried'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: star50-cross-confirm-validation-diag-${{ github.run_id }}
          path: artifacts/star50_cross_confirm_validation_diag
          retention-days: 14
