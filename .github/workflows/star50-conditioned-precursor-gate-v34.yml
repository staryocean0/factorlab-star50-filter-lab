name: star50-conditioned-precursor-gate-v34
on:
  push:
    branches: ["research/star50-conditioned-precursor-gate-v34-20260908"]
    paths: [".github/workflows/star50-conditioned-precursor-gate-v34.yml"]
permissions:
  contents: read
concurrency:
  group: star50-conditioned-precursor-gate-v34
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_REF: 731f565e8ef74f4679e85fea7a28cc612ce3be11
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout frozen v3.4 code and bounded STAR50 inputs
        uses: actions/checkout@v4
        with:
          ref: 731f565e8ef74f4679e85fea7a28cc612ce3be11
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/first_shock_morphology_v3/
            /docs/research/first_shock_seconds_v2/code/
            /docs/research/first_shock_gate_v1/code/
            /src/star50_filter/__init__.py
            /src/star50_filter/cloud_market_data.py
            /data/cross_index_risk_gate_v1/manifest.json
            /data/cross_index_risk_gate_v1/1m/000688.SH/202[2-5].parquet
            /data/cross_index_risk_gate_3s_v1/manifest.json
            /data/cross_index_risk_gate_3s_v1/000688.SH_202[2-5].parquet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          mkdir -p evidence/gate
          python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pyarrow pytest
          python -m pip freeze > evidence/environment.txt
      - name: Run frozen v3.4 tests
        run: |
          set -o pipefail
          python -m pytest -q docs/research/first_shock_morphology_v3/tests/test_conditioned_precursor_gate_v34.py --junitxml=evidence/tests.xml | tee evidence/tests.log
      - name: Run frozen historical-state conditioned gate
        run: |
          set -o pipefail
          python docs/research/first_shock_morphology_v3/code/conditioned_precursor_gate_v34.py --repo-root . --out evidence/gate | tee evidence/gate.log
      - name: Seal evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence'); files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,
                                'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt={'workflow_sha':os.environ['GITHUB_SHA'],'research_ref':os.environ['RESEARCH_REF'],
                   'run_id':os.environ['GITHUB_RUN_ID'],'files':files,'fresh_oos':False,
                   'read_2026':False,'production_authority':False}
          (root/'run_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=root/'gate/summary.json'
          if p.exists(): print('CONDITIONED_PRECURSOR_GATE_SUMMARY '+p.read_text())
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star50-conditioned-precursor-gate-v34-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
