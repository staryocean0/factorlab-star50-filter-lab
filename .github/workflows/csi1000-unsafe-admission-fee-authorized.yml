name: csi1000-unsafe-admission-fee
on:
  push:
    branches:
      - research/csi1000-unsafe-admission-fee-v1-20260908
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen Phase 3 inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/csi1000_unsafe_admission_fee_v1
            docs/research/state_conditioned_frequency_v2
            docs/research/post_shock_recovery_v1/code/state_sufficiency.py
            src/star50_filter/filters.py
            data/cross_index_risk_gate_v1/1m/000852.SH
            data/cross_index_risk_gate_2026_v1/1m/000852.SH
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scipy scikit-learn pytest
      - name: Run frozen Phase 3 tests
        run: python -m pytest -q docs/research/csi1000_unsafe_admission_fee_v1/tests
      - name: Run fee-aware admission comparison
        run: python docs/research/csi1000_unsafe_admission_fee_v1/code/run_fee_admission.py --repo-root . --out artifacts/csi1000_unsafe_admission_fee_v1
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('artifacts/csi1000_unsafe_admission_fee_v1')
          rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes(); rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          PY
      - name: Upload Phase 3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: csi1000-unsafe-admission-fee-${{ github.run_id }}
          path: artifacts/csi1000_unsafe_admission_fee_v1
          retention-days: 14
