name: highvol-recovery-hazard-v3-development

on:
  push:
    branches:
      - research/highvol-recovery-hazard-v3-20260910
    paths:
      - research/highvol_recovery_hazard_v3/**
      - .github/workflows/highvol-recovery-hazard-v3-dev.yml

jobs:
  development-hazard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen v3 code and Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/highvol_recovery_hazard_v3
            docs/research/highvol_unsafe_recovery_v2_anchor_20260910.md
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/market/5m/000688.SH/2020.parquet
            data/market/5m/000688.SH/2021.parquet
            data/market/5m/000688.SH/2022.parquet
            data/market/5m/000688.SH/2023.parquet
            data/market/5m/000852.SH/2020.parquet
            data/market/5m/000852.SH/2021.parquet
            data/market/5m/000852.SH/2022.parquet
            data/market/5m/000852.SH/2023.parquet
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest

      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .

      - name: Guard physical Development boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          for symbol in ['000688.SH','000852.SH']:
              base=Path('data/market/5m')/symbol
              got=sorted(p.name for p in base.glob('*.parquet'))
              exp=['2020.parquet','2021.parquet','2022.parquet','2023.parquet']
              assert got == exp, (symbol,got)
          assert not list(Path('data').rglob('2024.parquet'))
          assert not list(Path('data').rglob('2025.parquet'))
          assert not list(Path('data').rglob('2026.parquet'))
          print('Development physical boundary: OK')
          PY

      - name: Test frozen v3 measurement contract
        run: python -m pytest -q research/highvol_recovery_hazard_v3/test_hazard.py

      - name: Run v3 Development hazard study
        run: python research/highvol_recovery_hazard_v3/run_hazard.py --repo-root . --out artifacts/highvol_recovery_hazard_v3

      - name: Guard research role
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/highvol_recovery_hazard_v3/summary.json'))
          assert s['development_only'] is True
          assert s['state_thresholds_unchanged'] is True
          assert s['pnl_computed'] is False
          assert s['trading_rule_created'] is False
          assert s['validation_queried'] is False
          assert s['blackbox_queried'] is False
          assert s['production_authority'] is False
          assert set(s['episode_count']) == {'000688.SH','000852.SH'}
          assert all(v > 0 for v in s['episode_count'].values())
          print('v3 role guard: OK', s['episode_count'])
          PY

      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/highvol_recovery_hazard_v3')
          files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes()
                  files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'schema':'highvol_recovery_hazard_v3_dev_manifest','files':files},indent=2)+'\n')
          PY

      - name: Upload v3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: highvol-recovery-hazard-v3-${{ github.run_id }}
          path: artifacts/highvol_recovery_hazard_v3
          retention-days: 30
