name: remove-misrouted-r1-r2-from-star50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-misrouted-r1-r2-from-star50.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify R1/R2 package landed in destination
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/staryocean0/factorlab-trend-reversion-regime-lab/main/docs/research/R1_R2_MIGRATION_NOTE_20260909.md >/tmp/r1r2-note.md
          curl -fsSL https://raw.githubusercontent.com/staryocean0/factorlab-trend-reversion-regime-lab/main/scripts/rmr_parent_state_legacy/run_rmr_stage1_common_probe.py >/tmp/r1r2-runner.py
          grep -q 'R1/R2 migration' /tmp/r1r2-note.md
          grep -q 'def r1_events' /tmp/r1r2-runner.py
          grep -q 'def r2_events' /tmp/r1r2-runner.py
      - name: Remove misrouted R1/R2 current-tree package
        run: |
          set -euo pipefail
          git rm -r docs/archive/misrouted_rmr_from_overnight_20260909
          git rm -f docs/research/migrated_rmr_findings_20260909.md
          git rm -f docs/research/rmr_signal_source_map_20260909.md
      - name: Commit STAR50 cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "cleanup: remove misrouted R1/R2 research from STAR50 [skip ci]"
            git push origin HEAD:main
          fi
