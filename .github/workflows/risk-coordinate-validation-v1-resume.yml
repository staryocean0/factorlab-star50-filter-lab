name: risk-coordinate-validation-v1-resume
on:
  push:
    branches: [research/risk-coordinate-validation-resume-20260912]
    paths:
      - '.github/workflows/risk-coordinate-validation-v1-resume.yml'
      - 'docs/research/risk_coordinate_validation_v1/**'
      - 'docs/research/fine_activity_future_risk_v1/**'
      - 'docs/research/risk_coordinate_decomposition_v1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/research/risk_coordinate_validation_v1/
            /docs/research/risk_coordinate_decomposition_v1/
            /docs/research/fine_activity_future_risk_v1/
            /docs/governance/DATA_USAGE_POLICY_V2.md
            /docs/governance/data_usage_declaration.json
            /docs/governance/blackbox_query_ledger.json
            /scripts/validate_data_usage_policy.py
            /src/star50_filter/__init__.py
            /src/star50_filter/cloud_market_data.py
            /data/cross_index_risk_gate_v1/manifest.json
            /data/cross_index_risk_gate_v1/1m/000688.SH/2022.parquet
            /data/cross_index_risk_gate_v1/1m/000688.SH/2023.parquet
            /data/cross_index_risk_gate_v1/1m/000688.SH/2024.parquet
            /data/cross_index_risk_gate_v1/1m/000688.SH/2025.parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/2022.parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/2023.parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/2024.parquet
            /data/cross_index_risk_gate_v1/1m/000852.SH/2025.parquet
            /data/cross_index_risk_gate_3s_v1/manifest.json
            /data/cross_index_risk_gate_3s_v1/000688.SH_2022.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2023.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2024.parquet
            /data/cross_index_risk_gate_3s_v1/000688.SH_2025.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2022.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2023.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2024.parquet
            /data/cross_index_risk_gate_3s_v1/000852.SH_2025.parquet
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify frozen research blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/research/fine_activity_future_risk_v1/run_study.py)" = "2a5f607db1451a2e4576a9bc0940b67ac02f0d2e"
          test "$(git hash-object docs/research/fine_activity_future_risk_v1/FROZEN_PROTOCOL.md)" = "d43f5b4a2c0395d1d022a3fb5e10c58dce08de0c"
          test "$(git hash-object docs/research/risk_coordinate_decomposition_v1/FROZEN_PROTOCOL.md)" = "9672291188dc92ade1046de603d7b178fba783c8"
          test "$(git hash-object docs/research/risk_coordinate_decomposition_v1/RESULT.md)" = "832f632b882dcdd0fc51aa3ff83c9b814940e5cd"
          test "$(git hash-object docs/research/risk_coordinate_validation_v1/FROZEN_PROTOCOL.md)" = "18e330b3ea9067a27ba2ec5351f5f8136b5fcc89"
          test "$(git hash-object docs/research/risk_coordinate_validation_v1/run_validation.py)" = "669930a56f80249b63d55973219185eb83f55f42"
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest
      - run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard allowed fine-scale Validation inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(str(p) for p in Path('data').rglob('*.parquet'))
          assert len(files)==16,files
          assert all(any(y in x for y in ('2022','2023','2024','2025')) for x in files),files
          assert not any('2026' in x for x in files),files
          assert not Path('data/cross_index_risk_gate_2026_v1').exists()
          PY
      - run: python -m py_compile docs/research/risk_coordinate_validation_v1/run_validation.py docs/research/fine_activity_future_risk_v1/run_study.py
      - run: python -m pytest -q docs/research/fine_activity_future_risk_v1/test_study.py
      - name: Execute frozen reusable Validation diagnostic
        run: |
          mkdir -p artifacts
          python docs/research/risk_coordinate_validation_v1/run_validation.py --repo-root . --out artifacts/risk_coordinate_validation_v1
      - name: Guard scientific role
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/risk_coordinate_validation_v1/summary.json'))
          assert s['validation_queried'] is True and s['validation_years']==[2024,2025]
          assert s['read_2026'] is False and s['blackbox_queried'] is False and s['fresh_oos'] is False
          assert s['returns_or_pnl_evaluated'] is False and s['candidate_nominated'] is False and s['production_authority'] is False
          print(json.dumps(s,indent=2))
          PY
      - name: Hash evidence
        run: |
          cd artifacts/risk_coordinate_validation_v1
          sha256sum * | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: risk-coordinate-validation-v1-${{ github.run_id }}
          path: artifacts/risk_coordinate_validation_v1
          retention-days: 90
          if-no-files-found: error
