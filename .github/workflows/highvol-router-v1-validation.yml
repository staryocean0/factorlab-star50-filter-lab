name: highvol-router-v1-reusable-validation
on:
  push:
    branches:
      - research/highvol-router-v1-validation-20260909
  workflow_dispatch:

jobs:
  validation-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen router and Validation inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/research/highvol_router_v1_dev
            docs/research/highvol_router_v1_validation
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/cross_index_risk_gate_v1/1m/000852.SH/2024.parquet
            data/cross_index_risk_gate_v1/1m/000852.SH/2025.parquet
            data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Restore exact historical 2026 Validation bytes
        run: |
          git fetch --depth=1 origin refs/heads/research/csi1000-long-accel-validation-diag-v1-20260908:refs/remotes/origin/router-validation-data
          git checkout refs/remotes/origin/router-validation-data -- data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet
          test "$(git hash-object data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet)" = "8de5cd3caab99dbacae229a2c87f15c4ff2f8558"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed Validation dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest
      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard Validation physical boundary before strategy execution
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p24=Path('data/cross_index_risk_gate_v1/1m/000852.SH/2024.parquet')
          p25=Path('data/cross_index_risk_gate_v1/1m/000852.SH/2025.parquet')
          p26=Path('data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet')
          assert p24.exists() and p25.exists() and p26.exists()
          for year,p in [(2024,p24),(2025,p25)]:
              d=pd.read_parquet(p,columns=['trading_day']).trading_day.astype(str).str[:10]
              assert d.min() >= f'{year}-01-01' and d.max() <= f'{year}-12-31', (year,d.min(),d.max())
          d=pd.read_parquet(p26,columns=['trading_day']).trading_day.astype(str).str[:10]
          assert d.min() >= '2026-01-01'
          assert d.max() <= '2026-08-21', (d.min(),d.max())
          print('Validation boundary: OK', d.min(), d.max())
          PY
      - name: Test frozen Router Validation identity
        run: python -m pytest -q docs/research/highvol_router_v1_validation/test_router_validation.py docs/research/highvol_router_v1_dev/test_router_dev.py
      - name: Run frozen Router V1 reusable Validation replay
        run: python docs/research/highvol_router_v1_validation/run_router_validation.py --repo-root . --out artifacts/highvol_router_v1_validation
      - name: Guard role and frozen mechanics
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='artifacts/highvol_router_v1_validation'
          s=json.load(open(root+'/summary.json'))
          assert s['fresh_oos'] is False
          assert s['fit_performed'] is False
          assert s['parameter_change_performed'] is False
          assert s['blackbox_queried'] is False
          assert s['production_authority'] is False
          assert s['star50_route_trade_count'] == 0
          assert s['max_concurrent_positions'] <= 1
          z=pd.read_csv(root+'/validation_trades.csv')
          if len(z):
              day=z.trading_day.astype(str).str[:10]
              assert day.min() >= '2024-01-01' and day.max() <= '2026-08-21'
          print('Validation scientific verdict:', s['validation_supported'])
          print(json.dumps(s['acceptance'],sort_keys=True))
          PY
      - name: Seal Validation artifact manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/highvol_router_v1_validation')
          files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes();files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'schema':'highvol_router_v1_validation_artifact_manifest','files':files},indent=2)+'\n')
          PY
      - name: Upload Validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: highvol-router-v1-validation-${{ github.run_id }}
          path: artifacts/highvol_router_v1_validation
          retention-days: 30
