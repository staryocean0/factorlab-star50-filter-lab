name: historical-shock-burden-persist-evidence

on:
  workflow_dispatch:
  push:
    branches: [research/historical-shock-burden-utility-v1-20260912]
    paths:
      - '.github/workflows/historical-shock-burden-persist-evidence.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/historical-shock-burden-utility-v1-20260912
          fetch-depth: 0
      - name: Download decisive artifact exactly
        uses: actions/download-artifact@v4
        with:
          name: historical-shock-burden-v1-validation-34679293167
          path: downloaded
          github-token: ${{ github.token }}
          run-id: 34679293167
      - name: Verify identities and copy evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum downloaded/VALIDATION_RESULTS.json | awk '{print $1}')" = "8fa3f332a033e8f57ebf3240e3891295444dd9b48a8e2f699e2244928eb2f8bd"
          test "$(sha256sum downloaded/FROZEN_MODELS.json | awk '{print $1}')" = "65f9403e3aae00873432403f833c1d8772429c5172fc7f3fd76581a19a4222d3"
          test "$(cat downloaded/MODEL_SHA256.txt)" = "65f9403e3aae00873432403f833c1d8772429c5172fc7f3fd76581a19a4222d3"
          rm -rf research/historical_shock_burden_utility_v1/evidence
          mkdir -p research/historical_shock_burden_utility_v1/evidence
          cp -a downloaded/. research/historical_shock_burden_utility_v1/evidence/
          cat > research/historical_shock_burden_utility_v1/evidence/EVIDENCE_SOURCE.json <<'JSON'
          {
            "schema": "historical_shock_burden_utility_v1_evidence_source",
            "decisive_run_id": 34679293167,
            "fit_job_id": 103514769483,
            "validation_job_id": 103514946904,
            "fit_artifact_id": 10293986119,
            "fit_artifact_zip_sha256": "153476b787b8ae8401d3029e36303f6ef8af0285a6ba245725e5ae12b5d032cd",
            "validation_artifact_id": 10294046103,
            "validation_artifact_bytes": 67129,
            "validation_artifact_zip_sha256": "943d44b741888307c978b4504edeb704ecdeedb75ecdf8f521eec07a4809f215",
            "validation_results_sha256": "8fa3f332a033e8f57ebf3240e3891295444dd9b48a8e2f699e2244928eb2f8bd",
            "frozen_models_sha256": "65f9403e3aae00873432403f833c1d8772429c5172fc7f3fd76581a19a4222d3",
            "source_artifact_copied_byte_for_byte": true,
            "validation_reused": true,
            "fresh_oos": false,
            "read_2026": false,
            "blackbox_queried": false,
            "pnl_computed": false,
            "production_authority": false
          }
          JSON
          python - <<'PY'
          import json
          p='research/historical_shock_burden_utility_v1/evidence/VALIDATION_RESULTS.json'
          j=json.load(open(p))
          assert j['decision']=='HISTORICAL_SHOCK_BURDEN_INCREMENTAL_UTILITY_NOT_SUPPORTED'
          assert not any(j['joint_endpoint_support'].values())
          assert j['model_sha256']=='65f9403e3aae00873432403f833c1d8772429c5172fc7f3fd76581a19a4222d3'
          assert j['validation_reused'] is True and j['fresh_oos'] is False
          assert j['read_2026'] is False and j['blackbox_queried'] is False
          assert j['pnl_computed'] is False and j['production_authority'] is False
          print('decisive evidence verified')
          PY
      - name: Commit exact evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_shock_burden_utility_v1/evidence
          if git diff --cached --quiet; then
            echo 'evidence already persisted'
            exit 0
          fi
          git commit -m "research: persist decisive historical shock-burden evidence [skip ci]"
          git push origin HEAD:research/historical-shock-burden-utility-v1-20260912
