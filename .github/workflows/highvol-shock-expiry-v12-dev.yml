name: highvol-shock-expiry-v12-development
on:
  push:
    branches:
      - research/highvol-shock-expiry-mechanism-v12-20260910
    paths:
      - .github/workflows/highvol-shock-expiry-v12-dev.yml
      - research/highvol_shock_expiry_v12/**
jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V12 lineage and Development-only inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/highvol_shock_expiry_v12
            research/highvol_recovery_survival_v11/run_survival.py
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/market/5m/000688.SH/2020.parquet
            data/market/5m/000688.SH/2021.parquet
            data/market/5m/000688.SH/2022.parquet
            data/market/5m/000688.SH/2023.parquet
            data/market/5m/000852.SH/2020.parquet
            data/market/5m/000852.SH/2021.parquet
            data/market/5m/000852.SH/2022.parquet
            data/market/5m/000852.SH/2023.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest
      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .
      - name: Guard physical Development boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          for s in ['000688.SH','000852.SH']:
              got=sorted(p.name for p in (Path('data/market/5m')/s).glob('*.parquet'))
              assert got==['2020.parquet','2021.parquet','2022.parquet','2023.parquet'],(s,got)
          assert not list(Path('data').rglob('2024.parquet'))
          assert not list(Path('data').rglob('2025.parquet'))
          assert not list(Path('data').rglob('2026.parquet'))
          print('V12 Development physical boundary: OK')
          PY
      - name: Test frozen V12 mechanism contract
        run: python -m pytest -q research/highvol_shock_expiry_v12/test_expiry.py
      - name: Run V12 shock-expiry mechanism
        run: python research/highvol_shock_expiry_v12/run_expiry.py --repo-root . --out artifacts/highvol_shock_expiry_v12
      - name: Guard diagnostic-only role
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/highvol_shock_expiry_v12/summary.json'))
          assert s['development_only'] is True
          assert s['rv_window_bars']==12
          assert s['threshold_search_performed'] is False
          assert s['validation_queried'] is False
          assert s['blackbox_queried'] is False
          assert s['pnl_computed'] is False
          assert s['trading_rule_created'] is False
          assert s['production_authority'] is False
          print('V12 shock-expiry mechanism supported:',s['shock_expiry_mechanism_supported'])
          print(json.dumps(s['acceptance'],sort_keys=True))
          PY
      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/highvol_shock_expiry_v12'); files=[]
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b=p.read_bytes(); files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'output_manifest.json').write_text(json.dumps({'schema':'highvol_shock_expiry_v12_dev_manifest','files':files},indent=2)+'\n')
          PY
      - name: Upload V12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: highvol-shock-expiry-v12-${{ github.run_id }}
          path: artifacts/highvol_shock_expiry_v12
          retention-days: 30
