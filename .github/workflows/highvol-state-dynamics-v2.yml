name: highvol-state-dynamics-v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/highvol_state_v2/**'
      - '.github/workflows/highvol-state-dynamics-v2.yml'
      - 'research/highvol_state_v1/run_analysis.py'
      - 'data/market/5m/000688.SH/**'
      - 'data/market/5m/000852.SH/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy
      - name: Static compile
        run: |
          python -m py_compile research/highvol_state_v1/run_analysis.py research/highvol_state_v2/run_episode_diagnostics.py
      - name: Run frozen recovery dynamics diagnostic
        run: |
          python research/highvol_state_v2/run_episode_diagnostics.py
      - name: Commit compact outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/highvol_state_v2/outputs/
          if ! git diff --cached --quiet; then
            git commit -m 'research: record HighVol unsafe recovery dynamics v2 [skip ci]'
            git push
          fi
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: highvol-state-dynamics-v2
          path: research/highvol_state_v2/outputs/
