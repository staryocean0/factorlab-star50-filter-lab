[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "factorlab-star50-filter-lab"
version = "0.1.0"
description = "Causal STAR50 / CSI1000 risk attributes and frozen research evidence; not a trading service"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<22",
  "pytest>=8.3,<9",
  "scipy>=1.15,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
maintenance = ["PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/star50_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

addopts = "--ignore=tests/integration"
