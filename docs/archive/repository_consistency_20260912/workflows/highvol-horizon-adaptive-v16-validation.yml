name: highvol-horizon-adaptive-v16-validation
on:
  push:
    branches:
      - research/highvol-horizon-adaptive-v16-validation-20260910
    paths:
      - .github/workflows/highvol-horizon-adaptive-v16-validation.yml
      - research/highvol_horizon_adaptive_v16_validation/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen V16 and Validation inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/highvol_horizon_adaptive_v16
            research/highvol_horizon_adaptive_v16_validation
            docs/governance/DATA_USAGE_POLICY_V2.md
            docs/governance/data_usage_declaration.json
            docs/governance/blackbox_query_ledger.json
            scripts/validate_data_usage_policy.py
            data/market/5m/000688.SH/2020.parquet
            data/market/5m/000688.SH/2021.parquet
            data/market/5m/000688.SH/2022.parquet
            data/market/5m/000688.SH/2023.parquet
            data/market/5m/000688.SH/2024.parquet
            data/market/5m/000688.SH/2025.parquet
            data/market/5m/000852.SH/2020.parquet
            data/market/5m/000852.SH/2021.parquet
            data/market/5m/000852.SH/2022.parquet
            data/market/5m/000852.SH/2023.parquet
            data/market/5m/000852.SH/2024.parquet
            data/market/5m/000852.SH/2025.parquet
            data/cross_index_risk_gate_v1/1m/000688.SH/2023.parquet
            data/cross_index_risk_gate_v1/1m/000852.SH/2023.parquet
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow pytest

      - name: Validate three-pool governance
        run: python scripts/validate_data_usage_policy.py --repo-root .

      - name: Materialize exact frozen V11 cohort builder
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin research/highvol-recovery-survival-v11-20260910
          test "$(git rev-parse FETCH_HEAD)" = "30fda623af5c9461ffe60c4985e6150f01eec8f8"
          mkdir -p research/highvol_recovery_survival_v11
          git show FETCH_HEAD:research/highvol_recovery_survival_v11/run_survival.py > research/highvol_recovery_survival_v11/run_survival.py
          test "$(git hash-object research/highvol_recovery_survival_v11/run_survival.py)" = "713f0dcc41e7f32f75934fc7709a406ff71579e6"

      - name: Restore sealed 2026 one-minute Validation inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin research/post-shock-recovery-2026-validation
          STAR_BLOB=$(git rev-parse FETCH_HEAD:data/cross_index_risk_gate_2026_v1/1m/000688.SH/2026.parquet)
          CSI_BLOB=$(git rev-parse FETCH_HEAD:data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet)
          test "$STAR_BLOB" = "4626fb307bbcae1c417ddcd69ac694cf322c8bbc"
          test "$CSI_BLOB" = "8de5cd3caab99dbacae229a2c87f15c4ff2f8558"
          mkdir -p data/cross_index_risk_gate_v1/1m/000688.SH data/cross_index_risk_gate_v1/1m/000852.SH
          git show FETCH_HEAD:data/cross_index_risk_gate_2026_v1/1m/000688.SH/2026.parquet > data/cross_index_risk_gate_v1/1m/000688.SH/2026.parquet
          git show FETCH_HEAD:data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet > data/cross_index_risk_gate_v1/1m/000852.SH/2026.parquet

      - name: Guard physical reusable Validation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import pandas as pd

          expected = {
              '000688.SH': '4626fb307bbcae1c417ddcd69ac694cf322c8bbc',
              '000852.SH': '8de5cd3caab99dbacae229a2c87f15c4ff2f8558',
          }

          def blob_sha(p):
              b = p.read_bytes()
              return hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()

          for symbol, sha in expected.items():
              base = Path('data/market/5m') / symbol
              got = sorted(p.name for p in base.glob('*.parquet'))
              assert got == [f'{y}.parquet' for y in range(2020, 2026)], (symbol, got)
              p = Path('data/cross_index_risk_gate_v1/1m') / symbol / '2026.parquet'
              assert blob_sha(p) == sha, (symbol, blob_sha(p), sha)
              x = pd.read_parquet(p, columns=['trading_day'])
              d = pd.to_datetime(x.trading_day).dt.strftime('%Y-%m-%d')
              assert d.min() >= '2026-01-01', (symbol, d.min())
              assert d.max() <= '2026-08-21', (symbol, d.max())
          assert not list(Path('data').rglob('*2027*.parquet'))
          print('V16 reusable Validation physical boundary: OK')
          PY

      - name: Test frozen V16 Validation contract
        run: python -m pytest -q research/highvol_horizon_adaptive_v16_validation/test_validation.py

      - name: Run frozen V16 reusable Validation
        run: python research/highvol_horizon_adaptive_v16_validation/run_validation.py --repo-root . --out artifacts/highvol_horizon_adaptive_v16_validation

      - name: Guard research-only authority
        run: |
          python - <<'PY'
          import json
          s = json.load(open('artifacts/highvol_horizon_adaptive_v16_validation/summary.json'))
          assert s['fit_performed'] is False
          assert s['parameter_change_performed'] is False
          assert s['threshold_search_performed'] is False
          assert s['posthoc_horizon_selection'] is False
          assert s['projection_change_performed'] is False
          assert s['pnl_computed'] is False
          assert s['trading_rule_created'] is False
          assert s['blackbox_queried'] is False
          assert s['production_authority'] is False
          print('V16 full Validation supported:', s['full_validation_supported'])
          print('row_count:', s['row_count'])
          print('pooled:', json.dumps(s['pooled_scores'], sort_keys=True))
          print('annual_brier_win_count:', s['annual_brier_win_count'])
          print('acceptance:', json.dumps(s['acceptance'], sort_keys=True))
          PY

      - name: Seal output manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('artifacts/highvol_horizon_adaptive_v16_validation')
          files = []
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b = p.read_bytes()
                  files.append({'name': p.name, 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
          (root / 'output_manifest.json').write_text(
              json.dumps({'schema': 'highvol_horizon_adaptive_v16_validation_manifest', 'files': files}, indent=2) + '\n'
          )
          PY

      - name: Upload V16 Validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: highvol-horizon-adaptive-v16-validation-${{ github.run_id }}
          path: artifacts/highvol_horizon_adaptive_v16_validation
          retention-days: 30
