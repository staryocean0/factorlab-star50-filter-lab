name: import-highvol-5m-data

on:
  push:
    paths:
      - '.github/workflows/import-highvol-5m-data.yml'

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy required 5m yearly parquet shards
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/staryocean0/factorlab-trend-reversion-regime-lab/main/data/market/5m'
          mkdir -p data/market/5m/000688.SH data/market/5m/000852.SH

          copy_and_check() {
            symbol="$1"
            year="$2"
            expected="$3"
            dest="data/market/5m/${symbol}/${year}.parquet"
            echo "fetching ${symbol} ${year}.parquet"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/${symbol}/${year}.parquet" \
              --output "$dest"
            test -s "$dest"
            got="$(git hash-object "$dest")"
            if [ "$got" != "$expected" ]; then
              echo "blob mismatch for ${symbol} ${year}: expected=${expected} got=${got}"
              exit 1
            fi
          }

          copy_and_check 000688.SH 2020 36fdf5c907eaaa5d7b8eacaff24f601c539cc302
          copy_and_check 000688.SH 2021 804d49ec5338b1e3b8dd65e640ed49231c927ce9
          copy_and_check 000688.SH 2022 c3c343f53f7323656815950f54bb962dfab5b703
          copy_and_check 000688.SH 2023 02c3a9474dff4e5203cec12ca7a24a3b2be8994b
          copy_and_check 000688.SH 2024 2d75a6ba7623c5fe9e3b36cb0904ee542d33110c
          copy_and_check 000688.SH 2025 32d6d1754f965dd6298c885e30b244b877d694ed

          copy_and_check 000852.SH 2021 aba298f940c7992ec8814dd8ece197477d106fa9
          copy_and_check 000852.SH 2022 fe6eed805f7237091813c32d25011848fc29b705
          copy_and_check 000852.SH 2023 0b17d76b150bfd15d45158f100748898e72089b1
          copy_and_check 000852.SH 2024 ba45837375d8a3ca64cb3faa7750bf51e9760796
          copy_and_check 000852.SH 2025 85159b9fa1b2b6854b1a0f04faa9f963e9d04c13

          cat > data/market/5m/000688.SH/PROVENANCE.md <<'EOF'
          # 000688.SH 5m data provenance

          These yearly Parquet shards were copied without transformation from:

          `staryocean0/factorlab-trend-reversion-regime-lab`

          Source paths:

          `data/market/5m/000688.SH/{2020..2025}.parquet`

          Git blob identity is verified by the importer before commit.
          EOF

      - name: Commit imported data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market/5m/000688.SH data/market/5m/000852.SH
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'data: import 2020-2025 highvol 5m inputs'
          git push
