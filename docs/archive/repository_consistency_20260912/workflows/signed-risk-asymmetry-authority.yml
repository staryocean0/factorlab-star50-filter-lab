name: signed-risk-asymmetry-authority

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [research/signed-risk-asymmetry-utility-v1-20260912]
    paths:
      - 'research/signed_risk_asymmetry_utility_v1/**'
      - 'scripts/validate_signed_risk_asymmetry_utility_v1.py'
      - '.github/workflows/signed-risk-asymmetry-authority.yml'

permissions:
  contents: read

jobs:
  validate-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate decisive authority chain
        run: python scripts/validate_signed_risk_asymmetry_utility_v1.py
