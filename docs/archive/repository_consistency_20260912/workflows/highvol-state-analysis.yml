name: highvol-state-analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/highvol_state_v1/run_analysis.py'
      - 'data/market/5m/000688.SH/**'
      - 'data/market/5m/000852.SH/**'
      - '.github/workflows/highvol-state-analysis.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy
      - name: Run highvol state analysis
        run: |
          python research/highvol_state_v1/run_analysis.py
      - name: Commit research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/highvol_state_v1/outputs/
          if ! git diff --cached --quiet; then
            git commit -m 'research: update highvol state results [skip ci]'
            git push
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: highvol-state-results
          path: research/highvol_state_v1/outputs/
