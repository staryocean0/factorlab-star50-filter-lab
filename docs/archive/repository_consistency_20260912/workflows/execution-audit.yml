name: execution-audit
on:
  push:
    branches: ["research/drawdown-conditions-20260905"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: python -m pytest -q
      - run: python scripts/validate_drawdown_study.py
      - run: python scripts/finalize_execution_audit.py --validate-only
